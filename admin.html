<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel administrativo | Valverde's</title>
<link rel="stylesheet" href="estilos/estilos_principales.css">
<style>
.admin-shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh;width:100%;max-width:none;margin:0;background:#f3f7f4}.admin-sidebar{position:sticky;top:0;height:100vh;background:#123722;color:white;padding:22px}.admin-brand{display:flex;align-items:center;gap:10px;margin-bottom:30px}.admin-brand img{width:48px;height:48px;border-radius:12px;background:white;object-fit:contain}.admin-nav{display:grid;gap:6px}.admin-nav button{border:0;border-radius:10px;background:transparent;color:rgba(255,255,255,.78);padding:12px;text-align:left;cursor:pointer}.admin-nav button.active,.admin-nav button:hover{background:rgba(255,255,255,.12);color:white}.admin-main{padding:28px}.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.admin-header h1{margin:0}.admin-header button{border:1px solid var(--border);border-radius:10px;background:white;padding:10px 14px;font-weight:800}.metrics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric-card{border:1px solid var(--border);border-radius:18px;background:white;padding:20px}.metric-card span{color:var(--muted);font-size:13px}.metric-card strong{display:block;margin-top:6px;font-size:28px}.orders-card{margin-top:18px;border:1px solid var(--border);border-radius:18px;background:white;overflow:hidden}.orders-card h2{padding:18px 20px;margin:0;border-bottom:1px solid var(--border)}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px 14px;border-bottom:1px solid #edf1ee;text-align:left}th{background:#f8faf9;color:var(--muted);font-size:12px;text-transform:uppercase}td{font-size:14px}.status-select{min-width:130px;border:1px solid var(--border);border-radius:9px;padding:8px}.empty-state{text-align:center;padding:36px;color:var(--muted)}@media(max-width:900px){.admin-shell{grid-template-columns:72px minmax(0,1fr)}.admin-sidebar{padding:12px}.admin-brand h2,.admin-nav button span{display:none}.admin-brand{justify-content:center}.admin-nav button{text-align:center}.admin-main{padding:18px}.metrics-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="admin-shell">
<aside class="admin-sidebar">
<div class="admin-brand"><img src="imagenes/logo.png" alt="Valverde's"><h2>Valverde's</h2></div>
<nav class="admin-nav"><button class="active"><span>▦ Dashboard</span></button><button><span>🧾 Pedidos</span></button><button><span>📦 Productos</span></button><button><span>⚙️ Configuración</span></button></nav>
</aside>
<main class="admin-main">
<header class="admin-header"><div><span style="color:var(--muted)">Panel administrativo</span><h1>Bienvenido</h1></div><button type="button" id="logoutAdmin">Cerrar sesión</button></header>
<section class="metrics-grid"><article class="metric-card"><span>Pedidos pendientes</span><strong id="metricPendientes">0</strong></article><article class="metric-card"><span>Pedidos de hoy</span><strong id="metricHoy">0</strong></article><article class="metric-card"><span>Ventas registradas</span><strong id="metricVentas">S/ 0.00</strong></article></section>
<section class="orders-card"><h2>Pedidos recientes</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Cliente</th><th>Dirección</th><th>Pago</th><th>Total</th><th>Estado</th><th>Fecha</th></tr></thead><tbody id="ordersBody"><tr><td colspan="7" class="empty-state">Cargando pedidos...</td></tr></tbody></table></div></section>
</main>
</div>
<script>
async function cargarDashboard(){
 const response=await fetch("admin_api.php?action=dashboard",{credentials:"same-origin"});
 if(response.status===401){window.location.href="admin-login.html";return;}
 const data=await response.json();
 if(!data.ok)return;
 document.getElementById("metricPendientes").textContent=data.pendientes;
 document.getElementById("metricHoy").textContent=data.hoy;
 document.getElementById("metricVentas").textContent="S/ "+Number(data.ventas).toFixed(2);
 const body=document.getElementById("ordersBody");
 if(!data.pedidos.length){body.innerHTML='<tr><td colspan="7" class="empty-state">Aún no hay pedidos registrados.</td></tr>';return;}
 body.innerHTML=data.pedidos.map(p=>`<tr><td>#${p.id}</td><td>${p.cliente}</td><td>${p.direccion}</td><td>${p.metodo_pago}</td><td><strong>S/ ${Number(p.total).toFixed(2)}</strong></td><td><select class="status-select" onchange="actualizarEstado(${p.id},this.value)"><option ${p.estado==="Pendiente"?"selected":""}>Pendiente</option><option ${p.estado==="Confirmado"?"selected":""}>Confirmado</option><option ${p.estado==="En reparto"?"selected":""}>En reparto</option><option ${p.estado==="Entregado"?"selected":""}>Entregado</option><option ${p.estado==="Cancelado"?"selected":""}>Cancelado</option></select></td><td>${new Date(p.creado_en).toLocaleString("es-PE")}</td></tr>`).join("");
}
async function actualizarEstado(id,estado){const form=new FormData();form.append("action","update_status");form.append("id",id);form.append("estado",estado);await fetch("admin_api.php",{method:"POST",body:form,credentials:"same-origin"});cargarDashboard();}
document.getElementById("logoutAdmin").addEventListener("click",async()=>{const form=new FormData();form.append("action","logout");await fetch("admin_api.php",{method:"POST",body:form,credentials:"same-origin"});window.location.href="admin-login.html";});
cargarDashboard();
</script>
</body>
</html>
