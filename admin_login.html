<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso administrativo | Valverde's</title>
<link rel="stylesheet" href="estilos/estilos_principales.css">
<style>
body{min-height:100vh;display:grid;place-items:center}.admin-login-card{width:min(430px,calc(100% - 30px));border:1px solid var(--border);border-radius:24px;background:white;padding:32px;box-shadow:var(--shadow-md)}.admin-login-card img{width:72px;height:72px;object-fit:contain}.admin-login-card h1{margin:14px 0 4px}.admin-login-card p{color:var(--muted)}.admin-login-card label{display:block;margin:14px 0 6px;font-size:13px;font-weight:800}.admin-login-card input{width:100%;height:48px;border:1px solid var(--border);border-radius:11px;padding:10px 12px}.admin-login-card button{width:100%;height:48px;margin-top:18px;border:0;border-radius:11px;background:var(--primary);color:white;font-weight:900}.demo-credentials{margin-top:16px;border-radius:12px;background:var(--primary-soft);padding:12px;font-size:13px}
</style>
</head>
<body>
<main class="admin-login-card">
<img src="imagenes/logo.png" alt="Valverde's">
<h1>Panel administrativo</h1>
<p>Gestiona pedidos y operación del minimarket.</p>
<form id="adminLoginForm">
<label for="email">Correo o usuario</label><input id="email" name="email" type="text" autocomplete="username" required>
<label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Ingresar al panel</button>
</form>
<div class="demo-credentials"><strong>Acceso inicial:</strong> admin / admin123</div>
</main>
<script>
document.getElementById("adminLoginForm").addEventListener("submit",async function(event){
 event.preventDefault();
 const form = new FormData(event.currentTarget);
 form.append("action","login");
 const response = await fetch("admin_api.php",{method:"POST",body:form});
 const data = await response.json();
 if(data.ok){ window.location.href="admin.html"; } else { alert(data.message || "No se pudo iniciar sesión"); }
});
</script>
</body>
</html>
