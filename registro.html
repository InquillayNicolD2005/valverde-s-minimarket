<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta | Valverde's</title>
<link rel="stylesheet" href="estilos/estilos_principales.css">
<style>
.account-page{min-height:100vh;display:grid;grid-template-columns:.95fr 1.05fr}.account-brand{display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,rgba(13,76,41,.98),rgba(23,107,58,.86)),url("imagenes/tienda.png") center/cover;color:white;padding:38px}.account-brand img{width:64px;height:64px;border-radius:16px;background:white;padding:6px;object-fit:contain}.account-brand-copy{max-width:520px}.account-brand-copy span{font-size:12px;font-weight:900;letter-spacing:2px}.account-brand-copy h1{font-size:clamp(42px,6vw,72px);line-height:.95;margin:12px 0}.account-brand-copy p{color:rgba(255,255,255,.82)}.account-panel{display:grid;place-items:center;padding:30px}.account-card{width:min(620px,100%)}.account-card h2{font-size:36px;margin:0 0 6px}.account-card>p{color:var(--muted);margin:0 0 22px}.account-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:800}.field input{width:100%;height:48px;border:1px solid var(--border);border-radius:11px;background:#fbfcfb;padding:10px 12px}.field input:focus{outline:3px solid rgba(23,107,58,.12);border-color:var(--primary)}.account-submit{width:100%;height:50px;margin-top:16px;border:0;border-radius:12px;background:var(--primary);color:white;font-weight:900}.account-switch{text-align:center;color:var(--muted);margin-top:14px}.account-switch a{color:var(--primary);font-weight:900}@media(max-width:800px){.account-page{grid-template-columns:1fr}.account-brand{min-height:210px;padding:24px}.account-brand-copy h1{font-size:42px}.account-panel{padding:26px 20px}.account-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<main class="account-page">
<section class="account-brand"><img src="imagenes/logo.png" alt="Valverde's"><div class="account-brand-copy"><span>BIENVENIDO A TU MINIMARKET</span><h1>Compra fácil. Vive cerca.</h1><p>Crea tu cuenta para guardar tus datos de entrega y seguir tus pedidos.</p></div></section>
<section class="account-panel"><form class="account-card" action="registro.php" method="POST"><h2>Crear cuenta</h2><p>Completa tus datos para una compra más rápida.</p><div class="account-grid">
<div class="field"><label for="nombre">Nombre completo</label><input id="nombre" name="nombre" type="text" autocomplete="name" placeholder="Ej. Nicol Valverde" required></div>
<div class="field"><label for="usuario">Nombre de usuario</label><input id="usuario" name="usuario" type="text" autocomplete="username" minlength="3" placeholder="Ej. nicolv" required></div>
<div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" placeholder="nicol@email.com" required></div>
<div class="field"><label for="telefono">Celular</label><input id="telefono" name="telefono" type="tel" autocomplete="tel" inputmode="tel" placeholder="+51 999 999 999" required></div>
<div class="field full"><label for="direccion">Dirección de entrega</label><input id="direccion" name="direccion" type="text" autocomplete="street-address" placeholder="Av. El Sol 382, Cusco" required></div>
<div class="field full"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="Mínimo 6 caracteres" required></div>
</div><button class="account-submit" type="submit">Crear mi cuenta</button><p class="account-switch">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p></form></section>
</main>
</body>
</html>
