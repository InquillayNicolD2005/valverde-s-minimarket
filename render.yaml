services:
  - type: web
    name: valverdes-api
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: npm run db:migrate --workspace server && npm run db:seed --workspace server && npm start --workspace server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: valverdes-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_ORIGIN
        sync: false

databases:
  - name: valverdes-db
    databaseName: valverdes_db
    user: valverdes
